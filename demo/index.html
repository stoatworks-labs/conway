    <main id="demo">
      <noscript>
        <h1>Conway</h1>
        <p>
          An FFGL source that plays Conway's Game of Life, and an effect whose
          clip seeds the field. It's a grid of cells, each alive or dead, all
          updated at once by one rule over the eight neighbours, and nothing in
          it is a drawing of Life. The gliders, spaceships, blinkers and
          pulsars, Gosper's gun firing a glider every 30 generations,
          methuselahs boiling away for a thousand generations and a soup burning
          down to ash all come from the rule. Twelve relatives of Conway's rule
          are one dropdown away, cells are coloured by their age, and the field
          reseeds itself once it's settled down.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its generation clock
          in your browser, so it needs JavaScript and WebGL2. The plugin itself,
          its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/conway">its repository</a>.
        </p>
